        body{font-family:'Montserrat',sans-serif;background:#f0f4f8;display:flex;flex-direction:column;min-height:100vh}
        .header{background:linear-gradient(135deg,#1a3a5c,#217a8c);color:white;padding:12px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
        .header-brand{display:flex;align-items:center;gap:14px}
        .user-menu{display:flex;align-items:center;gap:12px}
        .btn-nav{background:rgba(255,255,255,.15);color:white;padding:7px 14px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;transition:background .2s}
        .btn-nav:hover{background:rgba(255,255,255,.25)}
        .btn-logout{background:#e74c3c;color:white;padding:7px 14px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600}
        .btn-logout:hover{background:#c0392b}
        .layout{display:flex;flex:1}
        .sidebar{width:230px;background:#1a3a5c;padding:24px 0}
        .sidebar ul{list-style:none}
        .sidebar a{display:block;color:rgba(255,255,255,.75);text-decoration:none;padding:14px 24px;font-size:14px;font-weight:600;border-left:4px solid transparent;transition:all .25s}
        .sidebar a:hover,.sidebar a.active{background:rgba(56,143,197,.2);color:#9dd9ff;border-left-color:#388fc5;padding-left:28px}
        .main{flex:1;padding:32px}
        .card{background:white;border-radius:12px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:24px}
        .card-title{color:#1a3a5c;font-size:17px;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:3px solid #388fc5;display:flex;align-items:center;gap:8px}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        label{display:block;font-size:11px;font-weight:700;color:#388fc5;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
        input[type="text"]{width:100%;padding:11px 14px;border:2px solid #e8f4fb;border-radius:8px;font-size:14px;font-family:'Montserrat',sans-serif;background:#f8fbfe;color:#1a3a5c;transition:all .2s}
        input:focus{outline:none;border-color:#388fc5;background:white;box-shadow:0 0 0 3px rgba(56,143,197,.1)}
        #msg{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px;display:none}
        #msg.exito{background:#e8f8f0;color:#1e6e42;display:block}
        #msg.error{background:#fef2f2;color:#c0392b;display:block}
        #msg.info{background:#e8f4fb;color:#1a3a5c;display:block}
        .btn-group{display:flex;gap:12px;margin-top:20px}
        .btn{padding:10px 24px;border:none;border-radius:8px;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;transition:all .2s}
        .btn-primary{background:linear-gradient(135deg,#388fc5,#217a8c);color:white}
        .btn-primary:hover{opacity:.9;box-shadow:0 4px 12px rgba(56,143,197,.3)}
        .btn-secondary{background:#e8f4fb;color:#1a3a5c}
        .btn-secondary:hover{background:#d0e8f5}
        .tabla-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .btn-refresh{background:#7aa79b;color:white;padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer}
        .btn-refresh:hover{background:#5a877b}
        table{width:100%;border-collapse:collapse;font-size:13px}
        thead tr{background:linear-gradient(135deg,#1a3a5c,#217a8c);color:white}
        thead th{padding:12px 16px;text-align:left;font-weight:700}
        tbody tr{border-bottom:1px solid #e8f4fb;transition:background .15s}
        tbody tr:hover{background:#f0f8ff}
        tbody td{padding:11px 16px;color:#1a3a5c;vertical-align:middle}
        .btn-edit{background:#e8f4fb;color:#1a3a5c;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;margin-right:4px;transition:background .2s}
        .btn-edit:hover{background:#388fc5;color:white}
        .btn-del{background:#fef2f2;color:#c0392b;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:background .2s}
        .btn-del:hover{background:#e74c3c;color:white}
        .sin-datos{text-align:center;color:#7aa79b;padding:30px;font-style:italic}
        .spinner{display:inline-block;width:16px;height:16px;border:3px solid #e8f4fb;border-top-color:#388fc5;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .footer{background:#1a3a5c;color:rgba(255,255,255,.7);text-align:center;padding:16px;font-size:13px;margin-top:auto}
        .footer a{color:#9dd9ff;text-decoration:none}
        @media(max-width:768px){.form-grid{grid-template-columns:1fr}.sidebar{display:none}}
    </style>
</head>
<body>
<header class="header">
    <div class="header-brand">
        <img src="EPIAS.jpg" alt="EPIAS" style="height:40px;width:40px;border-radius:6px;object-fit:cover;border:2px solid #388fc5;">
        <div>
            <span style="font-size:16px;font-weight:900;color:white;display:block;line-height:1.1;">EPIAS</span>
            <span style="font-size:10px;color:#9dd9ff;display:block;">Panel de Administración</span>
        </div>
    </div>
    <div class="user-menu">
        <span id="header-user" style="font-size:13px;color:#9dd9ff;font-weight:600;"></span>
        <a href="dasboard.php" class="btn-nav">🏠 Dashboard</a>
        <a href="landinpage.html" class="btn-nav">🌐 Sitio Web</a>
        <a href="logout.php" class="btn-logout">Cerrar Sesión</a>
    </div>
</header>
<div class="layout">
    <div class="sidebar">
        <ul>
            <li><a href="dasboard.php">🏠 Dashboard</a></li>
            <li><a href="clientes.html" class="active">👥 Clientes</a></li>
            <li><a href="usuarios.html">👤 Usuarios</a></li>
            <li><a href="productos.html">📦 Productos</a></li>
        </ul>
    </div>
    <main class="main">
        <div class="card">
            <h2 class="card-title" id="titulo-form">➕ Registrar Nuevo Cliente</h2>
            <div id="msg"></div>
            <input type="hidden" id="id-editando">
            <div class="form-grid">
                <div><label>Nombre</label><input type="text" id="nombre" placeholder="Nombre del cliente"></div>
                <div><label>Domicilio</label><input type="text" id="domicilio" placeholder="Dirección"></div>
                <div><label>Giro</label><input type="text" id="giro" placeholder="Giro comercial o industrial"></div>
                <div><label>Razón Social</label><input type="text" id="razon" placeholder="Razón social"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="guardar()">💾 Guardar Cliente</button>
                <button class="btn btn-secondary" onclick="cancelar()">✖ Cancelar</button>
            </div>
        </div>
        <div class="card">
            <div class="tabla-top">
                <h2 class="card-title" style="margin:0;border:none;padding:0;">👥 Lista de Clientes</h2>
                <button class="btn-refresh" onclick="cargar()">🔄 Actualizar</button>
            </div>
            <table>
                <thead><tr><th>ID</th><th>Nombre</th><th>Domicilio</th><th>Giro</th><th>Razón Social</th><th>Acciones</th></tr></thead>
                <tbody id="tbody"><tr><td colspan="6" class="sin-datos"><span class="spinner"></span> Cargando...</td></tr></tbody>
            </table>
        </div>
    </main>
</div>
<footer class="footer"><p>&copy; 2026 EPIAS — Ingeniería Ambiental y Sanitaria | <a href="landinpage.html">Sitio Web</a></p></footer>
<script>
const API='api_clientes.php';

fetch('sesion_check.php').then(r=>r.json()).then(d=>{
    if(!d.logueado){window.location.href='login.php';return;}
    document.getElementById('header-user').textContent='👋 '+d.nombre;
    cargar();
}).catch(()=>cargar());

function msg(txt,tipo){
    const d=document.getElementById('msg');
    d.className=tipo;d.textContent=txt;
    setTimeout(()=>{d.className='';d.textContent='';},3500);
}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'\\"');}

function cargar(){
    const tb=document.getElementById('tbody');
    tb.innerHTML='<tr><td colspan="6" class="sin-datos"><span class="spinner"></span> Cargando...</td></tr>';
    fetch(API).then(r=>r.json()).then(data=>{
        if(!data.length){tb.innerHTML='<tr><td colspan="6" class="sin-datos">No hay clientes registrados.</td></tr>';return;}
        tb.innerHTML=data.map(c=>`<tr>
            <td>${c.id}</td>
            <td><strong>${c.nombre}</strong></td>
            <td>${c.domicilio||'—'}</td>
            <td>${c.giro||'—'}</td>
            <td>${c.razon_social||'—'}</td>
            <td>
                <button class="btn-edit" onclick="editar(${c.id},'${esc(c.nombre)}','${esc(c.domicilio||'')}','${esc(c.giro||'')}','${esc(c.razon_social||'')}')">✏️ Editar</button>
                <button class="btn-del" onclick="eliminar(${c.id},'${esc(c.nombre)}')">🗑 Eliminar</button>
            </td></tr>`).join('');
    }).catch(()=>{
        tb.innerHTML='<tr><td colspan="6" class="sin-datos" style="color:#c0392b;">Error al conectar. Verifica la sesión.</td></tr>';
    });
}

function guardar(){
    const id=document.getElementById('id-editando').value;
    const nombre=document.getElementById('nombre').value.trim();
    const domicilio=document.getElementById('domicilio').value.trim();
    const giro=document.getElementById('giro').value.trim();
    const razon=document.getElementById('razon').value.trim();
    if(!nombre){msg('⚠️ El nombre es obligatorio.','error');return;}
    const datos={nombre,domicilio,giro,razon_social:razon};
    if(id) datos.id=id;
    msg('⏳ Guardando...','info');
    fetch(API,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)})
    .then(r=>r.json()).then(res=>{
        if(res.error){msg('❌ '+res.error,'error');}
        else{msg(id?'✅ Cliente actualizado.':'✅ Cliente registrado.','exito');cancelar();cargar();}
    }).catch(()=>msg('❌ Error de comunicación.','error'));
}

function eliminar(id,nombre){
    if(!confirm('¿Eliminar al cliente "'+nombre+'"?')) return;
    fetch(API,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})
    .then(r=>r.json()).then(res=>{
        if(res.ok){msg('🗑 Cliente eliminado.','exito');cargar();}
        else msg('❌ No se pudo eliminar.','error');
    }).catch(()=>msg('❌ Error al eliminar.','error'));
}

function editar(id,nombre,dom,giro,razon){
    document.getElementById('id-editando').value=id;
    document.getElementById('nombre').value=nombre;
    document.getElementById('domicilio').value=dom;
    document.getElementById('giro').value=giro;
    document.getElementById('razon').value=razon;
    document.getElementById('titulo-form').textContent='✏️ Editar Cliente';
    window.scrollTo({top:0,behavior:'smooth'});
}

function cancelar(){
    ['id-editando','nombre','domicilio','giro','razon'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('titulo-form').textContent='➕ Registrar Nuevo Cliente';
}
</script>
</body>
</html>
